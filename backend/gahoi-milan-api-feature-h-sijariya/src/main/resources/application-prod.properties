# Production profile. Values come from /etc/gahoi-milan/gahoi-milan.env,
# which the deploy workflow writes from GitHub secrets and systemd hands to
# the JVM. Activated with: --spring.profiles.active=prod

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# `none`, not `validate`: validate compares every column's exact JDBC type and
# refuses to start on cosmetic differences - tinyint vs integer for a column
# holding 1-3, for example - which blocks deploys for no runtime benefit. Never
# `update`: letting Hibernate alter a production schema on boot is how columns
# get silently dropped.
#
# The trade: a genuine mismatch (a renamed or missing column) now surfaces as a
# failing request instead of a failed startup. Worth re-enabling `validate` on
# a staging box before a release that changes entities.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=NATIVE
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.tomcat.max-threads=100
server.error.include-stacktrace=never
server.error.include-message=never

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}

aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET}

google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dummyClientId}
spring.security.oauth2.client.registration.google.redirect-uri=${API_BASE_URL}/api/v1/auth/grantcode

firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.enabled=${FIREBASE_ENABLED:true}
notifications.admin-secret=${NOTIFICATIONS_ADMIN_SECRET}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=WARN
logging.level.com.match.partner=INFO
logging.file.name=/var/log/gahoi-milan/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
